<text x="106" y="948" class="name">体验与利益</text>
<text x="106" y="991" class="small">有感受吗 · 什么会受损</text>
<text x="430" y="943" class="body">理论指标、机制与竞争解释</text>
<text x="430" y="982" class="body">区分人的感受与系统状态</text>
<text x="430" y="1025" class="small">关系感不单独证明意识</text>
<text x="978" y="953" class="source">内格尔 · 查尔默斯</text>
<text x="978" y="996" class="source">Butlin 等意识研究</text>
<rect x="72" y="1100" width="1296" height="240" rx="18" fill="#e9eef6"/>
<text x="106" y="1143" class="label">共同条件</text>
<text x="106" y="1191" class="body">谁提供维护，谁承担成本，谁能修改安排？</text>
<text x="106" y="1236" class="subtitle">创造者／使用者／维护者／其他受影响者</text>
<text x="106" y="1290" class="small">个人贡献也可以体现为：理解问题、检验假设、改善使用、支持接续。</text>
<text x="72" y="1380" class="small">本专题的研究归纳｜各行不是发展阶段，也不是人格、意识或权利的统一判据。</text>
