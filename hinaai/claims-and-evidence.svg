<text x="106" y="475" class="small">经验能否留下改变</text>
<text x="430" y="427" class="body">标明更新对象与保留范围</text>
<text x="430" y="466" class="body">同时看新能力与旧能力</text>
<text x="430" y="509" class="small">保存记录不保证学会</text>
