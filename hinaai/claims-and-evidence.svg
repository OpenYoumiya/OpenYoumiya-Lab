<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1410" viewBox="0 0 1440 1410" role="img" aria-labelledby="title desc">
<title id="title">HinaAI：从愿望到证据</title>
<desc id="desc">五组并列研究问题：任务能力、继续学习、保持连续、改变目的、体验与利益。各自列出核查方向、证据边界和阅读线索。共同条件是维护、成本、修改安排的权力及受影响者。这是本专题的研究归纳，不是能力排名。</desc>
<style>text{font-family:"Heiti SC","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#203047}.title{font-size:44px;font-weight:600}.subtitle{font-size:26px;fill:#54647a}.column{font-size:22px;fill:#617188}.name{font-size:31px;font-weight:600}.small{font-size:22px;fill:#637389}.body{font-size:26px}.source{font-size:23px;fill:#46576f}.label{font-size:23px;font-weight:600;fill:#526379}</style>
